<body>

    <div class="container">

        <div class="brand">StudyHub</div>

        <p class="subtitle">
            YOUR ACADEMIC LIFE, ORGANIZED
        </p>

        <h2>Verify Your Email</h2>

        <p class="description">
            Enter the six-digit verification code sent
            to your registered email address.
        </p>

        <div id="message" role="alert"></div>

        <form id="verifyOTPForm">

            <div class="form-group">

                <label for="otp">Verification Code</label>

                <input
                    type="text"
                    id="otp"
                    placeholder="000000"
                    inputmode="numeric"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    autocomplete="one-time-code"
                    required
                >

            </div>

            <button type="submit" id="verifyButton">
                Verify OTP
            </button>

        </form>

        <p class="login-link">
            <a href="login.html">Back to Login</a>
        </p>

    </div>

    <script>

        const verifyOTPForm =
            document.getElementById('verifyOTPForm');

        const otpInput =
            document.getElementById('otp');

        const message =
            document.getElementById('message');

        const verifyButton =
            document.getElementById('verifyButton');


        // Get email saved from Forgot Password page
        const email = sessionStorage.getItem('studyhubResetEmail');


        if (!email) {

            alert('Please enter your email address first.');

            window.location.href = 'forgot-password.html';

        }


        function showMessage(text, success = false) {

            message.style.display = 'block';

            message.textContent = text;

            message.style.background = success
                ? '#e6f7ed'
                : '#fdeaea';

            message.style.color = success
                ? '#176b39'
                : '#a12626';

        }


        // Allow numbers only
        otpInput.addEventListener('input', () => {

            otpInput.value = otpInput.value
                .replace(/\D/g, '')
                .slice(0, 6);

        });


        verifyOTPForm.addEventListener('submit', async (event) => {

            event.preventDefault();

            const otp = otpInput.value.trim();

            if (!/^\d{6}$/.test(otp)) {

                showMessage('Please enter a valid six-digit OTP.');

                return;

            }

            verifyButton.disabled = true;
            verifyButton.textContent = 'Verifying...';

            message.style.display = 'none';

            try {

                const response = await fetch(
                    'https://studyhub-backend-meza.onrender.com/api/auth/verify-reset-otp',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            email: email,
                            otp: otp
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.message || 'OTP verification failed.'
                    );

                }

                // Save reset token for password reset page
                sessionStorage.setItem(
                    'studyhubResetToken',
                    data.resetToken
                );

                showMessage(
                    'OTP verified successfully! Redirecting...',
                    true
                );

                window.location.href = 'reset-password.html';

            } catch (error) {

                showMessage(
                    error.message.includes('Failed to fetch')
                        ? 'Cannot connect to StudyHub server.'
                        : error.message
                );

                verifyButton.disabled = false;
                verifyButton.textContent = 'Verify OTP';

            }

        });

    </script>

</body>
