<body>

    <div class="container">

        <div class="brand">StudyHub</div>

        <p class="subtitle">
            YOUR ACADEMIC LIFE, ORGANIZED
        </p>

        <h2>Forgot Password?</h2>

        <p class="description">
            Enter your registered email address.
            We will send you a six-digit verification code
            to reset your password.
        </p>

        <div id="message" role="alert"></div>

        <form id="forgotPasswordForm">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >
            </div>

            <button type="submit" id="sendButton">
                Send OTP
            </button>

        </form>

        <p class="login-link">
            Remember your password?
            <a href="login.html">Back to Login</a>
        </p>

    </div>

    <script>
        const forgotPasswordForm =
            document.getElementById('forgotPasswordForm');

        const emailInput =
            document.getElementById('email');

        const message =
            document.getElementById('message');

        const sendButton =
            document.getElementById('sendButton');


        function showMessage(text, success = false) {

            message.style.display = 'block';

            message.textContent = text;

            message.style.background = success
                ? '#e6f7ed'
                : '#fdeaea';

            message.style.color = success
                ? '#176b39'
                : '#a12626';
        }


        forgotPasswordForm.addEventListener('submit', async (event) => {

            event.preventDefault();

            const email = emailInput.value.trim();

            sendButton.disabled = true;
            sendButton.textContent = 'Sending OTP...';

            message.style.display = 'none';

            try {

                const response = await fetch(
                    'http://localhost:5000/api/auth/forgot-password',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            email: email
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.message || 'Unable to process your request.'
                    );

                }

                showMessage(
                    data.message,
                    true
                );

                // Save email for the next password reset step
                sessionStorage.setItem(
                    'studyhubResetEmail',
                    email
                );

                // Move to OTP verification page
                window.location.href = 'verify-otp.html';

            } catch (error) {

                showMessage(
                    error.message.includes('Failed to fetch')
                        ? 'Cannot connect to StudyHub server. Please try again.'
                        : error.message
                );

                sendButton.disabled = false;
                sendButton.textContent = 'Send OTP';

            }

        });

    </script>

</body>
