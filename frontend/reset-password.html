<body>

    <div class="container">

        <div class="brand">StudyHub</div>

        <p class="subtitle">
            YOUR ACADEMIC LIFE, ORGANIZED
        </p>

        <h2>Reset Password</h2>

        <p class="description">
            Create a new password for your StudyHub account.
            Make sure your password is secure.
        </p>

        <div id="message" role="alert"></div>

        <form id="resetPasswordForm">

            <div class="form-group">

                <label for="newPassword">New Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <span
                        class="toggle-password"
                        onclick="togglePassword('newPassword', this)"
                    >
                        Show
                    </span>

                </div>

                <p class="password-hint">
                    Password must contain at least 8 characters.
                </p>

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <span
                        class="toggle-password"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        Show
                    </span>

                </div>

            </div>

            <button type="submit" id="resetButton">
                Reset Password
            </button>

        </form>

        <p class="login-link">
            <a href="login.html">Back to Login</a>
        </p>

    </div>

    <script>

        const resetPasswordForm =
            document.getElementById('resetPasswordForm');

        const newPasswordInput =
            document.getElementById('newPassword');

        const confirmPasswordInput =
            document.getElementById('confirmPassword');

        const resetButton =
            document.getElementById('resetButton');

        const message =
            document.getElementById('message');


        // Retrieve email and reset token
        const email = sessionStorage.getItem('studyhubResetEmail');

        const resetToken =
            sessionStorage.getItem('studyhubResetToken');


        // Check whether OTP verification was completed
        if (!email || !resetToken) {

            alert('Password reset session not found. Please verify your OTP first.');

            window.location.href = 'forgot-password.html';

        }


        function showMessage(text, success = false) {

            message.style.display = 'block';

            message.textContent = text;

            message.style.background = success
                ? '#e6f7ed'
                : '#fdeaea';

            message.style.color = success
                ? '#176b39'
                : '#a12626';

        }


        // Show or hide password
        function togglePassword(inputId, element) {

            const input = document.getElementById(inputId);

            if (input.type === 'password') {

                input.type = 'text';
                element.textContent = 'Hide';

            } else {

                input.type = 'password';
                element.textContent = 'Show';

            }

        }


        resetPasswordForm.addEventListener('submit', async (event) => {

            event.preventDefault();

            const newPassword = newPasswordInput.value;

            const confirmPassword = confirmPasswordInput.value;


            if (newPassword.length < 8) {

                showMessage(
                    'Password must contain at least 8 characters.'
                );

                return;

            }


            if (newPassword !== confirmPassword) {

                showMessage(
                    'Passwords do not match. Please try again.'
                );

                return;

            }


            resetButton.disabled = true;
            resetButton.textContent = 'Resetting Password...';

            message.style.display = 'none';


            try {

                const response = await fetch(
                    'https://studyhub-backend-meza.onrender.com/api/auth/reset-password',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({

                            email: email,

                            resetToken: resetToken,

                            newPassword: newPassword,

                            confirmPassword: confirmPassword

                        })
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message || 'Password reset failed.'
                    );

                }


                // Remove sensitive reset session data
                sessionStorage.removeItem('studyhubResetEmail');
                sessionStorage.removeItem('studyhubResetToken');


                showMessage(
                    'Password reset successfully! You can now login with your new password.',
                    true
                );


                resetPasswordForm.reset();

                resetButton.textContent = 'Password Reset Successful';


                // Redirect to login after successful reset
                setTimeout(() => {

                    window.location.href = 'login.html';

                }, 2500);


            } catch (error) {

                showMessage(
                    error.message.includes('Failed to fetch')
                        ? 'Cannot connect to StudyHub server.'
                        : error.message
                );

                resetButton.disabled = false;
                resetButton.textContent = 'Reset Password';

            }

        });

    </script>

</body>
</html>
