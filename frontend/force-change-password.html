
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#087fbe">

    <title>Change Password | StudyHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f7fb;
            color: #263445;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.07);
        }

        .brand {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #087fbe;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 13px;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            margin-bottom: 12px;
        }

        .description {
            text-align: center;
            color: #718096;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .notice {
            background: #fff4dc;
            color: #805500;
            padding: 12px;
            border-radius: 7px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d7e0e9;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #087fbe;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #087fbe;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #06689c;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 7px;
            font-size: 14px;
        }

        .logout-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .logout-link a {
            color: #087fbe;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="brand">StudyHub</div>

        <p class="subtitle">YOUR ACADEMIC LIFE, ORGANIZED</p>

        <h2>Change Your Password</h2>

        <p class="description">
            Before continuing to your dashboard, you must create
            a new personal password.
        </p>

        <div class="notice">
            <strong>Security Notice:</strong>
            Your administrator provided a temporary password.
            Please replace it with your own secure password.
        </div>

        <div id="message" role="alert"></div>

        <form id="changePasswordForm">

            <div class="form-group">
                <label for="currentPassword">Temporary / Current Password</label>
                <input
                    type="password"
                    id="currentPassword"
                    placeholder="Enter your temporary password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter your new password"
                    minlength="8"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password</label>
                <input
                    type="password"
                    id="confirmNewPassword"
                    placeholder="Confirm your new password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit" id="changeButton">
                Change Password
            </button>

        </form>

        <p class="logout-link">
            <a href="#" id="logoutLink">Logout</a>
        </p>

    </div>

    <script>
        const API_BASE = 'https://studyhub-backend-meza.onrender.com/api';

        const token = sessionStorage.getItem('studyhubToken');
        const studentData = sessionStorage.getItem('studyhubStudent');

        const form = document.getElementById('changePasswordForm');
        const message = document.getElementById('message');
        const changeButton = document.getElementById('changeButton');

        // CHECK LOGIN
        if (!token || !studentData) {
            window.location.href = 'login.html';
        }

        // CHECK IF PASSWORD CHANGE IS REQUIRED
        try {
            const student = JSON.parse(studentData || '{}');

            if (student.mustChangePassword !== true) {
                window.location.href = 'dashboard.html';
            }
        } catch (error) {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }

        function showMessage(text, success = false) {
            message.style.display = 'block';
            message.textContent = text;

            message.style.background = success
                ? '#e6f7ed'
                : '#fdeaea';

            message.style.color = success
                ? '#176b39'
                : '#a12626';
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const currentPassword =
                document.getElementById('currentPassword').value;

            const newPassword =
                document.getElementById('newPassword').value;

            const confirmNewPassword =
                document.getElementById('confirmNewPassword').value;

            if (newPassword.length < 8) {
                showMessage('New password must contain at least 8 characters.');
                return;
            }

            if (newPassword !== confirmNewPassword) {
                showMessage('New passwords do not match.');
                return;
            }

            changeButton.disabled = true;
            changeButton.textContent = 'Changing Password...';

            message.style.display = 'none';

            try {
                const response = await fetch(
                    `${API_BASE}/auth/change-password`,
                    {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            currentPassword,
                            newPassword,
                            confirmNewPassword
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || 'Unable to change password.'
                    );
                }

                // UPDATE LOCAL STUDENT INFORMATION
                const student = JSON.parse(
                    sessionStorage.getItem('studyhubStudent')
                );

                student.mustChangePassword = false;

                sessionStorage.setItem(
                    'studyhubStudent',
                    JSON.stringify(student)
                );

                showMessage(
                    'Password changed successfully! Redirecting to Dashboard...',
                    true
                );

                changeButton.textContent = 'Password Changed';

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);

            } catch (error) {
                showMessage(
                    error.message.includes('Failed to fetch')
                        ? 'Cannot connect to StudyHub server.'
                        : error.message
                );

                changeButton.disabled = false;
                changeButton.textContent = 'Change Password';
            }
        });

        // LOGOUT
        document.getElementById('logoutLink').addEventListener(
            'click',
            (event) => {
                event.preventDefault();

                sessionStorage.removeItem('studyhubToken');
                sessionStorage.removeItem('studyhubStudent');

                window.location.href = 'login.html';
            }
        );
    </script>

</body>
</html>
