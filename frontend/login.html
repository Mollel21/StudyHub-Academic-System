<script>
    const loginForm = document.getElementById('loginForm');
    const message = document.getElementById('message');
    const loginButton = document.getElementById('loginButton');

    function showMessage(text, success = false) {
        message.style.display = 'block';
        message.textContent = text;

        message.style.background = success
            ? '#e6f7ed'
            : '#fdeaea';

        message.style.color = success
            ? '#176b39'
            : '#a12626';
    }

    loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        loginButton.disabled = true;
        loginButton.textContent = 'Signing In...';
        message.style.display = 'none';

        try {
            const response = await fetch(
                'http://localhost:5000/api/auth/login',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || 'Login failed.');
            }

            sessionStorage.setItem('studyhubToken', data.token);

            sessionStorage.setItem(
                'studyhubStudent',
                JSON.stringify(data.student)
            );

            showMessage('Login successful! Redirecting...', true);

            if (data.student.mustChangePassword === true) {
                window.location.href = 'force-change-password.html';
            } else {
                window.location.href = 'dashboard.html';
            }

        } catch (error) {
            showMessage(
                error.message.includes('Failed to fetch')
                    ? 'Cannot connect to StudyHub server.'
                    : error.message
            );

            loginButton.disabled = false;
            loginButton.textContent = 'Sign In';
        }
    });
</script>
